model_params:
  drone_dim: 3
  num_views: 3
  z_dynamics:
    model: "linear"
    structured_AB: true
    affine_term: false
    z_dim: 24
  dt: 0.02
  delay: 2
  auto_encoder:
    multi_view: true
    control_inputs: true
    split_indices: [[0, 2, 4], [1, 3, 5]]
    H: 128
    W: 128
    CNN:
      encoder:
        num_in_channels: 6
        out_planes: [32, 48, 64, 48, 32]
        strides: [2, 2, 2, 2, 2]
        n_split_layers: 4
      decoder:
        num_out_channels: 2
        out_planes: [32, 48, 64, 48, 32]
        strides: [2, 2, 2, 2, 2]
    MLP:
      num_hidden_layers: 3
      hidden_dims: [512, 192, 192]
    activation: "relu"

training_params:
  drone_dim: 3
  num_epochs: 1000
  checkpoint_every: 10
  loss_weights: {y_pred: 250.0, y_rec: 40.0, z: 10.0, c: 0.15, a: 0.15}
  optimizer:
    lr:
      ab: 0.002
      ae: 0.002
    weight_decay: {ae: 8.0e-05, ab: 8.0e-05}
  lr_decay: 0.996
  curriculum:
    phase_epoch_triggers: [ 2, 100, 800 ]
    ramp_duration: 10