model_params:
  drone_dim: 2
  z_dynamics:
    model: "bilinear"
    z_dim: 20
    u_dim: 4
    structured_AB: true
    affine_term: false
  dt: 0.01
  auto_encoder:
    include_state_in_z: false
    dim_hidden_layers: [128, 128]
    num_hidden_layers: 2
    activation: "tanh"

training_params:
  closed_loop_every: 0
  closed_loop_replay_enabled: false
  num_epochs: 1400
  checkpoint_every: 10
  loss_weights: { pred_x: 10, pred_z: 1, rec: 5 }
  optimizer:
    l2_reg: 0.00001
    lr: 0.0012
  lr_decay: 0.996

closed_loop_augmentation:
  enabled: false
  control_config: configs/control/knmpc_sensor_2d_base.yaml
  frequency: 5
  num_rollouts: 20
  start_epoch: 50
  dataset_policy: append
