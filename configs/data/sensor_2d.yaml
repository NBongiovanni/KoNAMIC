dt: 0.001
t_sim: 3.0

ds_step: 10
smooth_window: 10

y_ref_max: 0.5
z_ref_max: 0.5

y_init_max: 0.5
z_init_max: 0.5
angle_init_max: 0

tau_ref_min: 0.05
tau_ref_max: 0.4

only_aggressive: False
init_angles_to_zero: False

seed: 1
delay: 0

split_lengths:
  train: 50
  val_1: 50
  val_2: 50

scaler:
  scale_x: true
  scale_u: true
  center: true
  mean_x: [0, 0, 0, 0, 0, 0]
  mean_u: [0.26487, 0]
num_workers: 2

downsample_factor: 1
train:
  num_steps_loaded: 300
  num_steps_pred: 50

val_datasets:
  - name: "short_horizon"
    num_steps_loaded: 300
    num_steps_pred: 50

  - name: "long_horizon"
    num_steps_loaded: 300
    num_steps_pred: 50

config_controller: "configs/control/pid_sensor_2d_base.yaml"