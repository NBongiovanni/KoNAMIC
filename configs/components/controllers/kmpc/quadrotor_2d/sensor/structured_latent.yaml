system_name: quadrotor_2d
modality: sensor
controller_type: kmpc
dt: 0.01
num_steps_horizon: 50
constraints:
  use_inputs_constraints: false
  force_limits:
  - 0
  - 1.2
  torque_limits:
  - -1
  - 1
cost:
  mode: structured_latent
  R:
  - 0.01
  - 0.01
  S:
  - 0.05
  - 0.05
  Q_positions: 2
  Q_velocities: 2
  P_positions: 2
  P_velocities: 2

solver_options_profile: bilinear_latent_medium
