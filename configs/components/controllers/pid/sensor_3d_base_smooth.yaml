modality: "sensor"
tracked_state_indices: [0, 1, 2]

kp_pos: [2, 2, 0.3]
ki_pos: [0.0, 0.0, 0.0]
kd_pos: [1.3, 1.3, 0.12]

kp_att: [0.8, 0.8, 0.1]
ki_att: [0.0, 0.0, 0.0]
